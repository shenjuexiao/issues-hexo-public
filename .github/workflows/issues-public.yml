# issues-public.yml
# github.com/shenjuexiao
# 20260729

# https://github.com/flytam/blog/issues/27
# issue 新增或者修改时触发工作流
# 拉取 hexo 源文件
# 将 issue 生成 hexo 源文件并输出到 hexo 源文件 blog-source 仓库的文章目录下并提交到 blog-source 仓库

# 源仓库（shenjuexiao/issues-shenjuexiao）：存放 Hexo 主题、配置、依赖等源文件
# 博客仓库（shenjuexiao/issues-public）：使用 Issues 作为文章存储，每个 Issue 就是一篇文章
# 自动化构建：博客仓库通过 GitHub Actions（issues-public.yml），将 Issues 转换为 Hexo 文章（日期-标题.md），
# 拉取源仓库的 Hexo，作为博客模板，生成静态页面到 gh-pages 分支 ./public，
# 再将 Hexo 文章（日期-标题.md），推送到源仓库 main 分支 ./source/_posts
# 部署本仓库使用 actions/deploy-pages
# 部署其他仓库使用 peaceiris/actions-gh-pages
# 编写 issues-public.yml 包含脚本解析 issue，输出日期-标题.md
# 跨仓库使用 token: ${{ secrets.ISSUES_PUBLIC }}


# workflow_dispatch:

name: Issues to Hexo Blog

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '指定要处理的 Issue 编号（留空则处理所有）'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-shenjuexiao
          token: ${{ secrets.ISSUES_PUBLIC }}
          path: source-repo
          
      - name: Checkout blog repository (for issues)
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-public
          token: ${{ secrets.ISSUES_PUBLIC }}
          path: blog-repo
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Hexo dependencies
        run: |
          cd source-repo
          npm install
          
      - name: Fetch and convert issues to markdown
        run: |
          cd blog-repo
          mkdir -p ../source-repo/source/_posts
          
          # 获取所有 open 状态的 issues
          ISSUES=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_PUBLIC }}" \
            "https://api.github.com/repos/shenjuexiao/issues-public/issues?state=open&per_page=100")
          
          # 如果指定了 issue_number，则只处理该 issue
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            ISSUE=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_PUBLIC }}" \
              "https://api.github.com/repos/shenjuexiao/issues-public/issues/$ISSUE_NUMBER")
            ISSUES="[$ISSUE]"
          fi
          
          # 处理每个 issue
          echo "$ISSUES" | jq -c '.[]' | while read -r issue; do
            # 提取信息
            TITLE=$(echo "$issue" | jq -r '.title')
            NUMBER=$(echo "$issue" | jq -r '.number')
            CREATED_AT=$(echo "$issue" | jq -r '.created_at')
            BODY=$(echo "$issue" | jq -r '.body')
            LABELS=$(echo "$issue" | jq -r '.labels[].name' | paste -sd ',' -)
            
            # 清理标题作为文件名
            SAFE_TITLE=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            
            # 格式化日期（YYYY-MM-DD）
            DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)
            
            # 生成文件名
            FILENAME="${DATE}-${SAFE_TITLE}.md"
            FILEPATH="../source-repo/source/_posts/$FILENAME"
            
            # 转义标题中的特殊字符（用于 YAML front matter）
            ESCAPED_TITLE=$(echo "$TITLE" | sed 's/"/\\"/g')
            
            # 方法1：使用 echo 替代 printf（更兼容）
            {
              echo '---'
              echo "title: \"$ESCAPED_TITLE\""
              echo "date: $CREATED_AT"
              echo "issue_number: $NUMBER"
              echo "labels: [$LABELS]"
              echo '---'
              echo ''
              echo "$BODY"
            } > "$FILEPATH"
            
            echo "Created post: $FILENAME"
          done
          
      - name: Check if any posts were created
        id: check_posts
        run: |
          POST_COUNT=$(ls -1 source-repo/source/_posts/*.md 2>/dev/null | wc -l)
          echo "post_count=$POST_COUNT" >> $GITHUB_OUTPUT
          echo "Found $POST_COUNT posts"
          
      - name: Generate Hexo static files
        if: steps.check_posts.outputs.post_count > 0
        run: |
          cd source-repo
          npx hexo clean
          npx hexo generate
          
      - name: Deploy to gh-pages (current repository)
        if: steps.check_posts.outputs.post_count > 0
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: source-repo/public
          
      - name: Deploy to gh-pages (other repository)
        if: steps.check_posts.outputs.post_count > 0
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ISSUES_PUBLIC }}
          external_repository: shenjuexiao/issues-public
          publish_branch: gh-pages
          publish_dir: ./source-repo/public
          
      - name: Push markdown files to source repository
        if: steps.check_posts.outputs.post_count > 0
        run: |
          cd source-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # 添加新文章到 git
          git add source/_posts/*.md
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update posts from issues [skip ci]"
            git push https://x-access-token:${{ secrets.ISSUES_PUBLIC }}@github.com/shenjuexiao/issues-shenjuexiao.git main
          fi