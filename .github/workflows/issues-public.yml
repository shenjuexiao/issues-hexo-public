# issues-public.yml
# github.com/shenjuexiao
# 20260729

# https://github.com/flytam/blog/issues/27
# issue 新增或者修改时触发工作流
# 拉取 hexo 源文件
# 将 issue 生成 hexo 源文件并输出到 hexo 源文件 blog-source 仓库的文章目录下并提交到 blog-source 仓库

# 源仓库（shenjuexiao/issues-shenjuexiao）：存放 Hexo 主题、配置等源文件
# 博客仓库（shenjuexiao/issues-public）：使用 Issues 作为文章存储，每个 Issue 就是一篇文章
# 自动化构建：博客仓库通过 GitHub Actions（issues-public.yml），将 Issues 转换为 Hexo 文章（日期-标题.md），
# 拉取源仓库的 Hexo，作为博客模板，生成静态页面到 ./public，
# 再将 Hexo 文章（日期-标题.md），推送到源仓库 ./source/_posts
# 部署本仓库使用 actions/deploy-pages
# 部署其他仓库使用 peaceiris/actions-gh-pages
# 编写 issues-public.yml 包含脚本解析 issue，输出日期-标题.md


name: Issue To Hexo Post & Auto Deploy

# 触发条件：Issue 创建、编辑、重命名
on:
  issues:
    types: [opened, edited, renamed]
  branches:
    - main
  workflow_dispatch:
  
# 权限配置
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 配置 Git 身份
        run: |
          git config --global user.name "${{ secrets.GITHUB_NAME }}"
          git config --global user.email "${{ secrets.GITHUB_EMAIL }}"

      - name: 拉取 Hexo 源仓库模板
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-shenjuexiao
          token: ${{ secrets.ISSUES_PUBLIC }}
          path: hexo-source

      - name: 解析 Issue 数据，生成 Hexo 文章 md 文件
        id: parse_issue
        run: |
          # 读取 GitHub 内置 Issue 环境变量
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_CREATED_AT="${{ github.event.issue.created_at }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          # 1. 格式化日期：YYYY-MM-DD
          POST_DATE=$(echo "$ISSUE_CREATED_AT" | cut -d'T' -f1)

          # 2. 清洗标题：去除特殊字符，防止文件名非法
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed -e 's/[\/:*?"<>|]/_/g' -e 's/ /-/g')

          # 3. 定义文章文件名：日期-清洗后标题.md
          POST_FILENAME="${POST_DATE}-${CLEAN_TITLE}.md"
          POST_FILE_PATH="./hexo-source/source/_posts/${POST_FILENAME}"

          # 4. 拼接 Hexo Front-matter 头部
          cat > "$POST_FILE_PATH" <<EOF
---
title: "${ISSUE_TITLE}"
date: ${ISSUE_CREATED_AT}
tags: []
categories: []
issue_id: ${ISSUE_NUMBER}
---

${ISSUE_BODY}
EOF

          # 输出变量给后续步骤使用
          echo "POST_FILENAME=${POST_FILENAME}" >> $GITHUB_ENV
          echo "POST_FILE_PATH=${POST_FILE_PATH}" >> $GITHUB_ENV
          echo "POST_DATE=${POST_DATE}" >> $GITHUB_ENV

      - name: 提交并推送博文至源仓库 hexo-source
        run: |
          cd hexo-source
          git add source/_posts/${{ env.POST_FILENAME }}
          git status
          git commit -m "Auto add post from issue #${{ github.event.issue.number }}: ${{ env.POST_FILENAME }}"
          git push origin main

      - name: 安装 Node 与 Hexo 依赖，生成静态页面 public
        run: |
          cd hexo-source
          node -v
          npm -v
          npm install
          npx hexo clean
          npx hexo generate

      # 分支1：部署到当前仓库 Pages（actions/deploy-pages 官方方案）
      - name: 打包静态产物
        id: build_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hexo-source/public

      - name: 部署到当前仓库 GitHub Pages
        if: github.repository == github.event.repository.full_name
        uses: actions/deploy-pages@v4

      # 分支2：部署到其他仓库 Pages（peaceiris/actions-gh-pages 第三方方案）
      - name: 部署到外部仓库 GitHub Pages
        if: github.repository != github.event.repository.full_name
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.ISSUES_PUBLIC }}
          publish_dir: hexo-source/public
          publish_branch: gh-pages