# issues-public.yml
# github.com/shenjuexiao
# 20260729

# https://github.com/flytam/blog/issues/27
# issue 新增或者修改时触发工作流
# 拉取 hexo 源文件
# 将 issue 生成 hexo 源文件并输出到 hexo 源文件 blog-source 仓库的文章目录下并提交到 blog-source 仓库

# 源仓库：存放 Hexo 主题、配置等源文件
# 博客仓库：使用 Issues 作为文章存储，每个 Issue 就是一篇文章
# 自动化构建：博客仓库通过 GitHub Actions（issues-public.yml），将 Issues 转换为 Hexo 文章（日期-标题.md），
# 拉取源仓库的 Hexo，作为博客模板，生成静态页面到 ./public，
# 再将 Hexo 文章（日期-标题.md），推送到源仓库 ./source/_posts
# 部署使用 peaceiris/actions-gh-pages


name: Issue 转 Hexo 博文 + 自动构建部署
on:
  issues:
    types: [opened, edited, closed, reopened]

permissions:
  contents: write
  issues: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前博客仓库
        uses: actions/checkout@v4

      # 1. 读取 Issue 信息，生成 Hexo md 文件
      - name: 解析 Issue 生成博文
        id: gen-post
        run: |
          # 获取 Issue 基础信息
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_DATE="${{ github.event.issue.created_at }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          TAGS=$(jq -r '.issue.labels | map(.name) | join(", ")' $GITHUB_EVENT_PATH)

          # 格式化文件名 YYYY-MM-DD-title.md
          FILE_DATE=$(date -d "$ISSUE_DATE" +"%Y-%m-%d")
          SAFE_TITLE=$(echo "$ISSUE_TITLE" | sed 's/[\/:*?"<>| ]/-/g')
          POST_FILE="${FILE_DATE}-${SAFE_TITLE}.md"

          # 写入 Hexo Front-Matter + 正文
          mkdir -p ./tmp_posts
          cat > ./tmp_posts/$POST_FILE << EOF
---
title: $ISSUE_TITLE
date: $ISSUE_DATE
tags: [$TAGS]
issue_num: $ISSUE_NUMBER
---

$ISSUE_BODY
EOF
          echo "POST_FILE=$POST_FILE" >> $GITHUB_ENV

      # 2. 克隆 Hexo 源仓库（替换为你的源仓库地址）
      - name: 拉取 Hexo 源仓库模板
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-shenjuexiao # 替换源仓库
          token: ${{ secrets.ISSUES_PUBLIC }} # 具备源仓库读写权限的 Personal Token
          path: hexo-root

      # 3. 将生成的 md 文章推送到源仓库 source/_posts
      - name: 推送博文至源仓库
        run: |
          cp ./tmp_posts/${{ env.POST_FILE }} hexo-root/source/_posts/
          cd hexo-root
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add source/_posts/${{ env.POST_FILE }}
          git commit -m "auto add post from issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          git push origin main # 源仓库主分支

      # 4. 安装 Hexo 依赖，构建静态页面
      - name: 安装 Hexo 依赖
        run: |
          cd hexo-root
          npm install

      - name: Hexo 生成静态文件
        run: |
          cd hexo-root
          npx hexo clean
          npx hexo generate

      # 5. peaceiris/actions-gh-pages 部署 Pages
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hexo-root/public
          publish_branch: gh-pages