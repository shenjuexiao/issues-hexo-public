# issues-hexo-public.yml
# github.com/shenjuexiao
# 20260730

# https://github.com/flytam/blog/issues/27
# issue 新增或者修改时触发工作流
# 拉取 hexo 源文件
# 将 issue 生成 hexo 源文件并输出到 hexo 源文件 blog-source 仓库的文章目录下并提交到 blog-source 仓库

# 源仓库（shenjuexiao/issues-hexo-source）：存放 Hexo 主题、配置、依赖等源文件
# 博客仓库（shenjuexiao/issues-hexo-public）：使用 Issues 作为文章存储，每个 Issue 就是一篇文章
# 自动化构建：博客仓库通过 GitHub Actions（issues-hexo-public.yml），将 Issues 转换为 Hexo 文章（日期-标题.md），
# 拉取源仓库的 Hexo，作为博客模板，生成静态页面到 gh-pages 分支 ./public，
# 再将 Hexo 文章（日期-标题.md），推送到源仓库 main 分支 ./source/_posts
# 部署仓库使用 peaceiris/actions-gh-pages
# 编写 issues-hexo-public.yml 包含脚本解析 issue，输出日期-标题.md
# 跨仓库使用 token: ${{ secrets.ISSUES_HEXO }}

name: Issues to Hexo Blog

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '指定要处理的 Issue 编号，留空则处理所有'
        required: false
        default: ''

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      id-token: write
      pages: write
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-hexo-source
          token: ${{ secrets.ISSUES_HEXO }}
          path: source-repo
          
      - name: Checkout blog repository (for issues)
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-hexo-public
          token: ${{ secrets.ISSUES_HEXO }}
          path: blog-repo
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Hexo dependencies
        run: |
          cd source-repo
          npm install
          
      - name: Fetch and convert issues to markdown
        run: |
          cd blog-repo
          mkdir -p ../source-repo/source/_posts
          
          # 获取所有 issues（包括 closed 状态）
          ISSUES=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_HEXO }}" \
            "https://api.github.com/repos/shenjuexiao/issues-hexo-public/issues?state=all&per_page=100")
          
          # 如果指定 issue_number，只处理此 issue
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            ISSUE=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_HEXO }}" \
              "https://api.github.com/repos/shenjuexiao/issues-hexo-public/issues/$ISSUE_NUMBER")
            ISSUES="[$ISSUE]"
          fi
          
          # 获取当前所有已存在的文章列表（用于检测删除）
          EXISTING_POSTS=$(ls -1 ../source-repo/source/_posts/*.md 2>/dev/null || echo "")
          
          # 创建一个临时文件来跟踪处理的 issue 编号
          PROCESSED_ISSUES=$(mktemp)
          
          # 处理每个 issue
          echo "$ISSUES" | jq -c '.[]' | while read -r issue; do
            # 提取信息
            TITLE=$(echo "$issue" | jq -r '.title')
            NUMBER=$(echo "$issue" | jq -r '.number')
            STATE=$(echo "$issue" | jq -r '.state')
            CREATED_AT=$(echo "$issue" | jq -r '.created_at')
            UPDATED_AT=$(echo "$issue" | jq -r '.updated_at')
            BODY=$(echo "$issue" | jq -r '.body // ""')
            LABELS=$(echo "$issue" | jq -r '.labels[].name' | paste -sd ',' -)
            
            # 记录已处理的 issue 编号
            echo "$NUMBER" >> "$PROCESSED_ISSUES"
            
            # 清理标题作为文件名
            SAFE_TITLE=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            
            # 格式化日期 YYYY-MM-DD
            DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)
            
            # 生成文件名
            FILENAME="${DATE}-${SAFE_TITLE}.md"
            FILEPATH="../source-repo/source/_posts/$FILENAME"
            
            # 如果 issue 是 closed 状态，删除对应的文章
            if [ "$STATE" = "closed" ]; then
              if [ -f "$FILEPATH" ]; then
                rm -f "$FILEPATH"
                echo "Removed post: $FILENAME (issue closed)"
              fi
              continue
            fi
            
            # 转义标题中的特殊字符用于 YAML front matter
            ESCAPED_TITLE=$(echo "$TITLE" | sed 's/"/\\"/g')
            ESCAPED_BODY=$(echo "$BODY" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g')
            
            # 创建或更新 markdown 文件
            {
              echo '---'
              echo "title: \"$ESCAPED_TITLE\""
              echo "date: $CREATED_AT"
              echo "updated: $UPDATED_AT"
              echo "issue_number: $NUMBER"
              if [ -n "$LABELS" ]; then
                echo "labels: [$LABELS]"
              else
                echo "labels: []"
              fi
              echo "state: $STATE"
              echo '---'
              echo ''
              echo "$BODY"
            } > "$FILEPATH"
            
            echo "Created/Updated post: $FILENAME (issue #$NUMBER, state: $STATE)"
          done
          
          # 检查并删除不再存在的 issue 对应的文章
          if [ -n "$EXISTING_POSTS" ]; then
            for post in $EXISTING_POSTS; do
              # 从文件中读取 issue_number
              if [ -f "$post" ]; then
                ISSUE_NUM=$(grep "^issue_number:" "$post" | awk '{print $2}')
                if [ -n "$ISSUE_NUM" ]; then
                  # 检查这个 issue 是否还在处理列表中
                  if ! grep -q "^$ISSUE_NUM$" "$PROCESSED_ISSUES"; then
                    rm -f "$post"
                    echo "Removed orphaned post: $(basename "$post") (issue #$ISSUE_NUM no longer exists)"
                  fi
                fi
              fi
            done
          fi
          
          # 清理临时文件
          rm -f "$PROCESSED_ISSUES"
          
      - name: Check if any posts exist
        id: check_posts
        run: |
          POST_COUNT=$(ls -1 source-repo/source/_posts/*.md 2>/dev/null | wc -l)
          echo "post_count=$POST_COUNT" >> $GITHUB_OUTPUT
          echo "Found $POST_COUNT posts"
          
      - name: Generate Hexo static files
        if: steps.check_posts.outputs.post_count > 0
        run: |
          cd source-repo
          npx hexo clean
          npx hexo generate
          
      - name: Deploy to gh-pages (current repository)
        if: steps.check_posts.outputs.post_count > 0
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./source-repo/public
          
      - name: Deploy to gh-pages (other repository)
        if: steps.check_posts.outputs.post_count > 0
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ISSUES_HEXO }}
          external_repository: shenjuexiao/issues-hexo-public
          publish_branch: gh-pages
          publish_dir: ./source-repo/public
          
      - name: Push markdown files to source repository
        if: always()  # 即使没有文章也要执行，确保删除操作被推送
        run: |
          cd source-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # 添加所有变更（包括删除）
          git add -A source/_posts/
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # 生成提交信息
            if [ -n "${{ github.event.inputs.issue_number }}" ]; then
              COMMIT_MSG="Update issue #${{ github.event.inputs.issue_number }} [skip ci]"
            else
              COMMIT_MSG="Update posts from issues (event: ${{ github.event.action }}) [skip ci]"
            fi
            git commit -m "$COMMIT_MSG"
            git push https://x-access-token:${{ secrets.ISSUES_HEXO }}@github.com/shenjuexiao/issues-hexo-source.git main
          fi